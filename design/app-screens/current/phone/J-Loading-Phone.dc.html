<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Figtree:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0e6f6b}a:hover{color:#15262a}
button{font:inherit;cursor:pointer}

.jar{overflow:visible;display:block}
.jar .ink{fill:#15262a}.jar .sk{stroke:#15262a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.jar .sh{fill:rgba(0,0,0,.14)}.jar .wood{fill:#cfa57c}
.jar .z{font-family:Fredoka,sans-serif;font-weight:600;fill:#7a8e91}
.jar .eyes,.jar .bob,.jar .arm,.jar .sprout,.jar .conf,.jar .drop,.jar .z{transform-box:fill-box}
.jar.live .eyes{transform-origin:50% 50%;animation:jblink 4.6s infinite}
.jar.live .sprout{transform-origin:50% 100%;animation:jsway 2.8s ease-in-out infinite}
.jar.live .drop{animation:jdrip 1.4s ease-in infinite}
.jar.live .z1{animation:jfloatz 3s ease-in infinite}.jar.live .z2{animation:jfloatz 3s ease-in 1.2s infinite}
@keyframes jblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes jsway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes jdrip{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes jfloatz{0%{transform:translate(0,0) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(14px,-26px) scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){.jar *{animation:none!important}}


@keyframes fillbar{0%{width:10%}100%{width:90%}}
.loadbar{animation:fillbar 2.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.loadbar{animation:none;width:60%}}

</style>
</helmet>
